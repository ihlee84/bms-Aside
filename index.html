const roomDoc=JSON.parse(document.querySelector('#room-seed').textContent), roomRows=roomDoc.rooms, roomWorkRows=roomDoc.works;

function normalize(x){

 for(const k of Object.keys(schema)){

   if(!o||typeof o.id!=='string'||!/^[-a-zA-Z0-9_]{1,90}$/.test(o.id)||used.has(o.id))throw Error('백업에 잘못되었거나 중복된 식별자가 있습니다.');
   used.add(o.id);const a={id:o.id};for(const key of schema[k])a[key]=clean(o[key],['memo','detail','note'].includes(key)?3500:350);

   if(k==='works'||k==='ratings'){
    if(!a.title||!dvalid(a.start)||!dvalid(a.end)||a.start&&a.end&&a.start>a.end&&!a.start.startsWith(a.end)||a.written&&!dvalid(a.written))throw Error('공사명, 점검 구분 또는 입력 날짜를 확인해 주세요.');

   }
   if(k==='ratings'&&a.grade&&!grades.includes(a.grade))throw Error('구조안전등급은 A~E 중 하나를 선택해 주세요.');
   if(k==='certificates'){

    if(!certStatuses.includes(a.status)||a.issued&&!exact(a.issued)||a.expires&&!exact(a.expires)||a.issued&&a.expires&&a.issued>a.expires)throw Error('인증 상태와 날짜를 확인해 주세요.');

    if(pairs.has(a.bid))throw Error('한 건물에 인증 현황을 두 건 이상 등록할 수 없습니다.');pairs.add(a.bid);
   }

   return a;
  });
 }
 if(x.version===1){for(const item of seed.certificates.filter(r=>r.status==='미대상'&&exists.has(r.bid))){const prev=out.certificates.find(r=>r.bid===item.bid);if(prev){prev.status='미대상';prev.source=prev.source?`${prev.source} · ${item.source}(현황)`:item.source;}else{const next={id:item.id,bid:item.bid};if(out.certificates.some(r=>r.id===next.id))next.id=id();for(const key of schema.certificates)next[key]=item[key]||'';out.certificates.push(next);}}}

}

 let fields=k==='labs'?labFields(base,bSelected,prior):k!=='buildings'?filterSelect('건물','bid',bOptions(),bSelected):'';
 for(const key of k==='labs'?[]:schema[k].filter(key=>!hiddenLedgerColumn(k,key))){
  const label=labelsets[k][key],value=base[key]??(key==='status'?'취득':''),isReq=key==='name'||key==='title';
  if(key==='status'||k==='ratings'&&key==='grade'){fields+=filterSelect(label,key,key==='status'?certStatuses:[['','미기재'],...grades],value);continue}
  fields+=`<label${wide.includes(key)?' class="wide"':''}><span class="field-label">${e(label)}${isReq?' <small>(필수)</small>':''}</span>${['memo','detail','note'].includes(key)?`<textarea class="input" name="${key}" maxlength="3500">${e(value)}</textarea>`:`<input class="input" name="${key}" type="${fullKeys.includes(key)?'date':'text'}" ${isReq?'required':''} ${partialKeys.includes(key)?'placeholder="YYYY, YYYY-MM 또는 YYYY-MM-DD"':key==='year'?'placeholder="YYYY" inputmode="numeric"':key==='grade'&&k==='certificates'?'placeholder="예: 최우수"':key==='source'?'placeholder="문서명, 쪽수 또는 근거"':''} maxlength="350" value="${e(value)}">`}</label>`;
 }
 if(k==='works'||k==='ratings')fields+=`<label><span class="field-label">비용 (원)</span><input class="input" name="cost" type="number" min="0" max="9999999999999" step="1" value="${base.cost??''}"></label>`;
 dlg.innerHTML=shell(`${sectionTitles[k]} ${prior?'수정':'등록'}`,`<div class="formgrid">${fields}</div><p class="error-text" id="error" role="alert" hidden></p>`,(prior?btn('삭제','delete',rowRef(k,prior.id),'left danger'):'')+btn('취소','close')+'<button type="submit" class="btn primary">저장</button>',true);
 $('#editForm').addEventListener('submit',ev=>{
  ev.preventDefault();const f=new FormData(ev.currentTarget),r=Object.fromEntries(f);r.id=prior?.id||id();r.source=prior?.source||'';if(k==='works')r.company=prior?.company||'';if('cost' in r)r.cost=r.cost===''?null:Number(r.cost);if(k==='labs')for(const key of labNumbers)r[key]=r[key]===''?null:Number(r[key]);
  try{if(prior&&!db[k].some(o=>o.id===prior.id))throw Error('기록이 변경되었습니다. 편집창을 닫고 다시 확인해 주세요.');save({...db,[k]:prior?db[k].map(o=>o.id===prior.id?r:o):[...db[k],r]});dlg.close();render();notify('저장했습니다.')}catch(err){const el=$('#error');el.hidden=false;el.textContent=err.message}
 });openDialog();dlg.querySelector('input:not([type=hidden]),select')?.focus();
}
function ask(title,text,label,yes){conf.innerHTML=`<div class="dialog-bar"><h2 id="confTitle">${e(title)}</h2></div><div class="dialog-body"><p>${e(text)}</p></div><div class="dialog-foot">${btn('취소','cancel')}<button type="button" id="yes" class="btn danger">${e(label)}</button></div>`;$('#yes').onclick=()=>{conf.close();try{yes()}catch(err){notify(err.message,true)}};conf.showModal();conf.querySelector('[data-act="cancel"]').focus()}
function del(k,i){if(!db[k]?.some(r=>r.id===i))return;const linked=()=>k==='buildings'&&['works','ratings','certificates','labs'].some(s=>db[s].some(r=>r.bid===i));if(linked())return notify('연결된 공사, 점검·진단, 인증 또는 연구실이 있어 삭제할 수 없습니다.',true);ask('기록을 삭제할까요?','삭제된 기록은 백업 파일 없이는 되돌릴 수 없습니다.','삭제',()=>{if(linked())throw Error('연결된 기록이 있어 건물을 삭제할 수 없습니다.');save({...db,[k]:db[k].filter(r=>r.id!==i)});dlg.close();render();notify('삭제했습니다.')})}
function dl(name,type,content){const u=URL.createObjectURL(new Blob([content],{type}));const a=document.createElement('a');a.download=name;a.href=u;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),30000)}
function csvCell(val){let s=String(val??'');if(/^[\s\u200B\uFEFF]*[=+\-@＝＋－＠]|^[\t\r\n]/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"'}
function csv(){
 if(current==='labs')return labCSV();
 const k=current,rows=getRows(k);if(!rows.length)return notify('내보낼 결과가 없습니다.',true);
 const kk=schema[k].filter(key=>!hiddenLedgerColumn(k,key));
 const header=[...(k==='buildings'?[]:['건물']),...kk.map(key=>labelsets[k][key]),...(['works','ratings'].includes(k)?['비용(원)']:[])];
 const vals=rows.map(x=>k==='certificates'?[x.b.name,...kk.map(key=>key==='status'?certState(x.r):x.r?.[key])]:[...(k==='buildings'?[]:[bLabel(bld(x.bid))]),...kk.map(key=>x[key]),...(['works','ratings'].includes(k)?[x.cost]:[])]);
 dl(`동양미래대학교_${intros[k][0].replaceAll(' ','_')}_${ymd()}.csv`,'text/csv;charset=utf-8','\ufeff'+[header,...vals].map(r=>r.map(csvCell).join(',')).join('\r\n'));notify(`조회 결과 ${rows.length}개를 CSV로 내보냈습니다.`);
}
$('#upload').addEventListener('change',async ev=>{const file=ev.target.files?.[0];ev.target.value='';if(!file)return;try{if(file.size>20*1024*1024)throw Error('20MB 이하의 백업 파일을 선택해 주세요.');let raw;try{raw=JSON.parse((await file.text()).replace(/^\uFEFF/,''))}catch{throw Error('JSON 파일을 읽을 수 없습니다.')}const parsed=normalize(raw);ask('백업을 복원할까요?',`현재 데이터를 ‘${file.name}’의 건물 ${parsed.buildings.length}동, 연구실 ${parsed.labs.length}실 및 연결 이력으로 교체합니다.`,'복원',()=>{save(parsed,{restore:true});go('home');notify('백업을 복원했습니다.')})}catch(err){notify(err.message,true)}});
const setFilter=ev=>{if(ev.target.form?.id==='filters'&&Object.hasOwn(filter,ev.target.name)){filter[ev.target.name]=ev.target.value;updateList()}};
v.addEventListener('input',ev=>{if(ev.target.id==='roomQuery'){roomSel.q=ev.target.value;roomRefresh();}else if(ev.target.name==='q')setFilter(ev)});
v.addEventListener('change',ev=>{const t=ev.target;if(t.id==='roomBuilding'){roomSel={building:t.value,id:'',q:''};$('#roomQuery').value='';roomRefresh();}else if(t.id==='roomPicker'){roomSel.id=t.value;roomDetailRender();}else setFilter(ev)});v.addEventListener('submit',ev=>{if(ev.target.id==='filters')ev.preventDefault()});
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-act]');if(!b)return;const {act,page,bid,key,kind,id:i}=b.dataset;
 switch(act){case 'go':go(page,bid,key);break;case 'room-install':roomInstallEditor(i);break;case 'room-install-add':if(dlg.querySelectorAll('.install-form-row').length<50)$('#installFormRows').insertAdjacentHTML('beforeend',roomInstallFormRow());break;case 'room-install-remove':b.closest('.install-form-row')?.remove();break;case 'room-install-reset':roomInstallReset(i);break;case 'room-project':roomProjectDetail(i);break;case 'go-from-detail':dlg.close();go(page,bid,key);break;case 'clear':go(current);break;case 'detail':detail(kind,i);break;case 'edit':editor(kind,i);break;case 'new':editor(kind,'',bid);break;case 'delete':del(kind,i);break;case 'close':dlg.close();break;case 'cancel':conf.close();break;case 'print':window.print();break;case 'csv':csv();break;case 'backup':if(readFailed)return notify('기존 저장 데이터를 읽지 못했습니다.',true);dl(`동양미래대학교_시설관리대장_백업_${ymd()}.json`,'application/json;charset=utf-8',JSON.stringify(db,null,2));notify('JSON 백업을 내려받았습니다.');break;case 'restore':$('#upload').click();break}
});
window.addEventListener('storage',ev=>{if(ev.key===KEY||ev.key===null){db=read();if(filter.bid&&!bld(filter.bid))filter.bid='';render();notify('다른 창에서 저장한 내용을 반영했습니다.')}});
window.addEventListener('focus',()=>{if($('#today').textContent!==dates.format(new Date()))render()});
$('#mark').innerHTML=icon('building');render();
</script></body></html>
